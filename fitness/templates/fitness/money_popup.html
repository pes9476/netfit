{% load static %}
<dialog id="moneyPopup" aria-label="튼튼머니 홍보 안내">
  <a class="money-popup-link" href="https://nfa.kspo.or.kr/spoint/selectSpointIntro.kspo" target="_blank" rel="noopener noreferrer" aria-label="튼튼머니 공식 안내 보기 (새 창)">
    <img src="{% static 'fitness/img/money-poster-2026.jpg' %}" width="1654" height="2339" alt="2026년 튼튼머니. 운동하고 튼튼머니 채우세요! 참여 및 적립·사용 방법은 공식 안내에서 확인하세요.">
  </a>
  <div class="money-popup-footer">
    <label><input type="checkbox" id="moneyPopupHideToday"> 오늘 하루 보지 않기</label>
    <button type="button" id="moneyPopupClose" autofocus>닫기</button>
  </div>
</dialog>
<style>
  #moneyPopup{width:min(400px,calc(100vw - 24px),calc((100dvh - 76px) * 0.7071));max-height:calc(100dvh - 24px);position:fixed;inset:0 28px 0 auto;margin:auto 0;padding:0;border:1px solid #222;border-radius:0;background:#fff;color:#111;box-shadow:0 16px 60px #0005;overflow:auto}
  #moneyPopup::backdrop{background:#0008}
  #moneyPopup .money-popup-link{display:block;line-height:0}
  #moneyPopup img{display:block;width:100%;height:auto}
  #moneyPopup .money-popup-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;min-height:40px;background:#fff;font-size:14px;box-sizing:border-box}
  #moneyPopup .money-popup-footer label{display:flex;align-items:center;gap:5px;cursor:pointer}
  #moneyPopupHideToday{width:16px;height:16px;margin:0;flex-shrink:0}
  #moneyPopupClose{padding:5px 2px;margin:0;border:0;background:none;color:#111;font:inherit;cursor:pointer;white-space:nowrap}
  #moneyPopup :focus-visible{outline:2px solid #125cb0;outline-offset:-2px}
  @media(max-width:600px){#moneyPopup{inset:0 12px 0 auto;}}
  @media(max-height:450px){#moneyPopup{width:min(400px,calc(100vw - 24px))}.money-popup-footer{position:sticky;bottom:0}}
</style>
<script>
(() => {
  const popup = document.getElementById('moneyPopup');
  const close = document.getElementById('moneyPopupClose');
  const hide = document.getElementById('moneyPopupHideToday');
  if (!popup || !close || !hide || typeof popup.showModal !== 'function') return;
  const key = 'fitbattle.moneyPopup.hiddenDate';
  const today = () => {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  };
  let hidden = false;
  try { hidden = localStorage.getItem(key) === today(); } catch {}
  hide.addEventListener('change', () => {
    try {
      if (hide.checked) localStorage.setItem(key, today());
      else localStorage.removeItem(key);
    } catch {}
  });
  close.addEventListener('click', () => popup.close());
  if (!hidden) popup.showModal();
})();
</script>

{% extends "fitness/base.html" %}
{% block content %}
<section class="panel netfit-welcome">
  <div class="logo">NET<b>FIT</b><small>MOVE · GROW · BATTLE</small></div>
  <p class="eyebrow">나의 운동, 나의 성장</p>
  <h1>오늘의 운동을<br>내 카드의 성장으로</h1>
  <p>운동을 기록하고 캐릭터를 성장시켜 보세요.<br>친구들과 함께 카드 배틀에도 도전하세요.</p>
  <div class="mascot-showcase" aria-label="넷핏 마스코트">
    <div class="mascot-tile"><div class="avatar-roster style-active" role="img" aria-label="달리는 백호"></div><small>백호 · 러닝</small></div>
    <div class="mascot-tile"><div class="avatar-roster style-muscular" role="img" aria-label="덤벨을 든 백곰"></div><small>백곰 · 파워</small></div>
    <div class="mascot-tile"><div class="avatar-roster style-soft" role="img" aria-label="점프하는 햄스터"></div><small>햄스터 · 에너지</small></div>
    <div class="mascot-tile"><div class="avatar-roster style-balanced" role="img" aria-label="초록 아기공룡"></div><small>아기공룡 · 밸런스</small></div>
  </div>
  <a class="button" href="{% url 'login' %}">로그인하고 시작하기 →</a>
  <p style="font-size:13px">아이디로 로그인하거나 카카오 계정으로 시작하세요. <a href="{% url 'register' %}">회원가입</a></p>
</section>
{% endblock %}

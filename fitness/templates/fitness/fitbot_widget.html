{% load static %}
<!-- NETFIT 핏봇 (Groq AI Chatbot Widget) -->
<style>
#netfit-fitbot{position:fixed;right:24px;bottom:max(22px,env(safe-area-inset-bottom));z-index:9990;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#e2e8f0;text-align:left;isolation:isolate}
#netfit-fitbot *{box-sizing:border-box}
#netfit-fitbot [hidden]{display:none!important}
#netfit-fitbot button,#netfit-fitbot input,#netfit-fitbot select{font:inherit;letter-spacing:normal}
#netfit-fitbot button{cursor:pointer;width:auto;min-height:0;color:inherit;text-transform:none;box-shadow:none}
#netfit-fitbot button:disabled{opacity:.5;cursor:wait}
#netfit-fitbot button:focus-visible,#netfit-fitbot input:focus-visible,#netfit-fitbot select:focus-visible{outline:2px solid #00f59b;outline-offset:2px}

/* 말풍선 (캐릭터 호버 말풍선) */
#netfit-fitbot .fb-launch{position:relative;width:292px;height:184px}
#netfit-fitbot .fb-bubble{position:absolute;top:0;left:0;width:188px;min-height:64px;z-index:8;margin:0;background:#0d1520;border:1px solid rgba(0,245,155,0.4);border-radius:20px;padding:13px 16px;font-size:13.5px;font-weight:700;color:#f1f5f9;box-shadow:0 10px 35px rgba(0,0,0,0.7),0 0 15px rgba(0,245,155,0.15)}
#netfit-fitbot .fb-bubble:after{content:'';position:absolute;right:40px;bottom:-8px;background:#0d1520;width:14px;height:14px;transform:rotate(45deg);border-right:1px solid rgba(0,245,155,0.4);border-bottom:1px solid rgba(0,245,155,0.4)}

/* 캐릭터 카드 뭉치 */
#netfit-fitbot .fb-cards{position:absolute;bottom:0;right:0;width:274px;height:106px;padding:0;border:0;background:transparent}
#netfit-fitbot .fb-face{position:absolute;left:3px;top:19px;width:86px;height:86px;max-width:none;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:transparent;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.6));transform:translateX(calc(58px * var(--index))) rotate(calc(-9deg + 5deg * var(--index)));z-index:calc(4 - var(--index));transition:transform .28s ease,filter .28s ease}
#netfit-fitbot .fb-face img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
#netfit-fitbot .fb-face.fb-front{transform:translateX(calc(58px * var(--index))) translateY(-8px) rotate(calc(-9deg + 5deg * var(--index))) scale(1.08);z-index:5}
#netfit-fitbot .fb-face:hover,#netfit-fitbot .fb-face:focus-visible{z-index:6;transform:translateX(calc(58px * var(--index))) translateY(-13px) scale(1.16);filter:drop-shadow(0 10px 18px rgba(0,245,155,0.35))}
#netfit-fitbot .fb-face[data-bot="court"] img{clip-path:inset(0 0 0 5%)}
#netfit-fitbot .fb-dismiss{position:absolute;top:2px;left:0;width:32px;height:32px;padding:0;border:1px solid rgba(255,255,255,0.15);border-radius:50%;background:#0d1520;color:#94a3b8;font-size:22px;z-index:9;opacity:0;pointer-events:none;transition:all .15s;display:grid;place-items:center;line-height:1}
#netfit-fitbot .fb-dismiss:hover{background:#1a2736;color:#f87171;border-color:#f87171}

/* 대화창 전체 프레임 (다크 사이버네틱 테마) */
#netfit-fitbot .fb-dialog{position:absolute;bottom:220px;right:0;width:min(382px,calc(100vw - 32px));height:500px;max-height:calc(100dvh - 250px);min-height:240px;display:flex;flex-direction:column;background:#0b1118;border:1px solid rgba(0,245,155,0.3);border-radius:21px;box-shadow:0 20px 60px rgba(0,0,0,0.85),0 0 25px rgba(0,245,155,0.15);overflow:hidden}

/* 대화창 헤더 */
#netfit-fitbot .fb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0e1724 0%,#111e30 100%);border-bottom:1px solid rgba(255,255,255,0.08);margin:0}
#netfit-fitbot .fb-head img{width:36px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5))}
#netfit-fitbot .fb-title{flex:1;font-size:14.5px;font-weight:800;color:#ffffff;letter-spacing:-0.2px}
#netfit-fitbot .fb-head button{border:0;background:none;font-size:22px;color:#94a3b8;padding:0 5px;transition:color .15s;line-height:1}
#netfit-fitbot .fb-head button:hover{color:#f87171}

/* 캐릭터 선택 탭 */
#netfit-fitbot .fb-tabs{display:flex;gap:6px;padding:10px 12px;background:#080d14;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:nowrap;margin:0;overflow:auto}
#netfit-fitbot .fb-tabs button{flex:1;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:7px 5px;background:rgba(255,255,255,0.04);color:#94a3b8;font-size:12px;font-weight:700;white-space:nowrap;transition:all .18s ease}
#netfit-fitbot .fb-tabs button:hover{background:rgba(255,255,255,0.08);color:#e2e8f0}
#netfit-fitbot .fb-tabs button[aria-pressed=true]{background:rgba(0,245,155,0.18);color:#00f59b;border-color:rgba(0,245,155,0.5);box-shadow:0 0 12px rgba(0,245,155,0.2)}

/* 시설 검색 필터 */
#netfit-fitbot .fb-filters{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#090f17;border-bottom:1px solid rgba(255,255,255,0.06)}
#netfit-fitbot .fb-filters label{font-size:11px;color:#94a3b8;font-weight:700}
#netfit-fitbot .fb-filters select,#netfit-fitbot .fb-query{display:block;width:100%;min-width:0;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:7px 8px;color:#f1f5f9;background:#111c2a;font-size:12px;outline:none;transition:border-color .15s}
#netfit-fitbot .fb-filters select:focus,#netfit-fitbot .fb-query:focus{border-color:#00f59b}
#netfit-fitbot .fb-search{grid-column:span 2;background:linear-gradient(135deg,#00f59b 0%,#00b87a 100%);color:#090d16;font-weight:900;border:0;border-radius:9px;padding:8px;font-size:12.5px;transition:opacity .15s}
#netfit-fitbot .fb-search:hover{opacity:.9}

/* 대화 메시지 영역 및 서있는 캐릭터 프로필 아바타 */
#netfit-fitbot .fb-messages{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#080d14;overscroll-behavior:contain}
#netfit-fitbot .fb-msg-wrap{display:flex;align-items:flex-start;gap:10px;width:100%}
#netfit-fitbot .fb-msg-wrap.user{justify-content:flex-end}
#netfit-fitbot .fb-msg-wrap.error{justify-content:center}
#netfit-fitbot .fb-avatar{width:38px;height:48px;min-width:38px;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;margin-top:-2px;user-select:none}
#netfit-fitbot .fb-avatar img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.65)) drop-shadow(0 0 6px rgba(0,245,155,0.25));transition:transform .18s ease}
#netfit-fitbot .fb-avatar:hover img{transform:scale(1.12)}
#netfit-fitbot .fb-bubble-group{display:flex;flex-direction:column;gap:6px;max-width:82%}
#netfit-fitbot .fb-msg-wrap.user .fb-bubble-group{max-width:88%;align-items:flex-end}
#netfit-fitbot .fb-msg{padding:10px 13px;background:rgba(255,255,255,0.06);color:#f1f5f9;border:1px solid rgba(255,255,255,0.07);border-radius:15px;border-top-left-radius:3px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.55;width:fit-content}
#netfit-fitbot .fb-msg.user{background:rgba(0,245,155,0.18);color:#e6fff5;border:1px solid rgba(0,245,155,0.38);box-shadow:0 2px 10px rgba(0,245,155,0.12);border-radius:15px;border-top-right-radius:3px}
#netfit-fitbot .fb-msg.error{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);border-radius:12px;font-size:12px}
#netfit-fitbot .fb-note{margin:0;padding:6px 14px;font-size:10px;color:#64748b;background:#080d14;border-top:1px solid rgba(255,255,255,0.04)}

/* 입력창 & 전송 버튼 */
#netfit-fitbot form{display:flex;gap:8px;margin:0;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.08);background:#0b1118}
#netfit-fitbot .fb-input{min-width:0;flex:1;border:1px solid rgba(255,255,255,0.12);background:#070b10;color:#ffffff;border-radius:11px;padding:9px 12px;font-size:14px;outline:none;transition:border-color .15s}
#netfit-fitbot .fb-input:focus{border-color:#00f59b}
#netfit-fitbot .fb-input::placeholder{color:#64748b}
#netfit-fitbot form button{border:0;background:linear-gradient(135deg,#00f59b 0%,#00b87a 100%);color:#090d16;font-weight:900;border-radius:11px;padding:0 14px;font-size:13px;transition:opacity .15s}
#netfit-fitbot form button:hover{opacity:.9}

/* 시설 카드 */
#netfit-fitbot .fb-facility{border:1px solid rgba(0,245,155,0.25);border-radius:12px;padding:11px 13px;background:rgba(16,28,42,0.7);flex-shrink:0}
#netfit-fitbot .fb-facility strong{color:#ffffff;font-size:13px}
#netfit-fitbot .fb-facility p{margin:4px 0 6px;color:#94a3b8;font-size:11.5px}
#netfit-fitbot a{color:#00f59b;text-decoration:none;font-size:11.5px;font-weight:700}
#netfit-fitbot a:hover{text-decoration:underline}
#netfit-fitbot .fb-more{padding:8px}

/* 토스트 & 복원 칩 */
#netfit-fitbot .fb-toast{position:absolute;bottom:0;right:0;width:290px;padding:13px 16px;border-radius:14px;background:#0e1724;color:#e2e8f0;border:1px solid rgba(0,245,155,0.3);box-shadow:0 8px 30px rgba(0,0,0,0.7)}
#netfit-fitbot .fb-reopen-pill{display:inline-flex;align-items:center;gap:6px;background:#0d1520;color:#00f59b;border:1px solid rgba(0,245,155,0.4);box-shadow:0 4px 16px rgba(0,0,0,.5);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s ease;z-index:5}
#netfit-fitbot .fb-reopen-pill:hover{transform:translateY(-2px);background:#132030;box-shadow:0 6px 20px rgba(0,245,155,.25)}
#netfit-fitbot .fb-reopen-pill[hidden]{display:none!important}
.netfit-fitbot-reopen{border:1px solid #00f59b!important;border-radius:10px!important;background:#0d1520!important;color:#00f59b!important;padding:8px 13px!important;font:700 13px system-ui!important;cursor:pointer!important}

@media(hover:none),(pointer:coarse){#netfit-fitbot .fb-dismiss{opacity:1;pointer-events:auto}}
@media(max-width:600px){
  #netfit-fitbot{right:10px;bottom:max(12px,env(safe-area-inset-bottom))}
  #netfit-fitbot .fb-dialog{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));right:12px;width:calc(100vw - 24px);height:min(550px,calc(100dvh - 35px));max-height:calc(100dvh - 35px);z-index:6}
  #netfit-fitbot .fb-launch{width:292px}
  #netfit-fitbot .fb-dismiss{opacity:1;pointer-events:auto}
}
@media(prefers-reduced-motion:reduce){#netfit-fitbot *{transition:none!important}}

/* 겹친 카드: 호버에서만 네 캐릭터가 펼쳐집니다. */
#netfit-fitbot .fb-launch{pointer-events:none}
#netfit-fitbot .fb-bubble{pointer-events:none}
#netfit-fitbot .fb-bubble:after{right:auto;left:var(--bubble-arrow,50%)}
#netfit-fitbot .fb-dismiss{top:130px;left:0;right:auto;opacity:0;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,0.6);display:grid;place-items:center;font-size:0;line-height:1}
#netfit-fitbot .fb-launch.fb-dismiss-visible .fb-dismiss,#netfit-fitbot .fb-launch:focus-within .fb-dismiss{opacity:1;pointer-events:auto}
#netfit-fitbot .fb-dismiss::before{content:"×";font-size:22px;line-height:1;transform:translateY(-2px)}
@media(hover:none),(pointer:coarse){#netfit-fitbot .fb-dismiss{opacity:1;pointer-events:auto}}
#netfit-fitbot .fb-cards{right:0;width:96px;pointer-events:none;transition:width .28s ease}
#netfit-fitbot .fb-face{pointer-events:auto}
#netfit-fitbot .fb-face[data-bot="coach"]{clip-path:inset(11% 2% 13% 13%)}
#netfit-fitbot .fb-face[data-bot="facility"]{clip-path:inset(15% 11% 11% 11%)}
#netfit-fitbot .fb-face[data-bot="meal"]{clip-path:inset(3% 0% 18% 13%)}
#netfit-fitbot .fb-face[data-bot="court"]{clip-path:inset(1% 13% 19% 0%)}
#netfit-fitbot .fb-launch.fb-expanded .fb-cards{width:274px}
#netfit-fitbot .fb-face{left:auto;right:4px;top:19px;transform:translate(calc(-7px * var(--index)),calc(2px * var(--index))) rotate(calc(-6deg + 4deg * var(--index)));z-index:calc(4 - var(--index))}
#netfit-fitbot .fb-face.fb-front{z-index:5;transform:translate(calc(-7px * var(--index)),-8px) rotate(0deg) scale(1.08)}
#netfit-fitbot .fb-launch.fb-expanded .fb-face{transform:translateX(calc(-58px * (3 - var(--index)))) rotate(calc(-9deg + 5deg * var(--index)));z-index:calc(4 - var(--index))}
#netfit-fitbot .fb-launch.fb-expanded .fb-face.fb-front{transform:translateX(calc(-58px * (3 - var(--index)))) translateY(-8px) rotate(calc(-9deg + 5deg * var(--index))) scale(1.08);z-index:5}
#netfit-fitbot .fb-launch.fb-expanded .fb-face:hover,#netfit-fitbot .fb-launch.fb-expanded .fb-face:focus-visible{z-index:6;transform:translateX(calc(-58px * (3 - var(--index)))) translateY(-13px) scale(1.16)}
#netfit-fitbot .fb-launch:not(.fb-expanded) .fb-face:hover,#netfit-fitbot .fb-launch:not(.fb-expanded) .fb-face:focus-visible{transform:translate(calc(-7px * var(--index)),-12px) scale(1.12);z-index:6}
#netfit-fitbot .fb-launch.fb-chat .fb-face{pointer-events:none}
#netfit-fitbot .fb-launch.fb-chat .fb-face.fb-front{pointer-events:auto}
</style>
<script data-demo="false" data-bootstrap="/fitbot/api/bootstrap/" data-endpoint="/fitbot/api/chat/" data-tiger="{% static 'images/net-pit.png' %}" data-bear="{% static 'images/net-pit-2.png' %}" data-hamster="{% static 'images/net-pit-3.png' %}" data-dino="{% static 'images/net-pit-4.png' %}">(() => {
  'use strict';
  if (window.NetfitFitbot) return;
  const script = document.currentScript;
  const config = {...script.dataset};
  const bots = [
    {id:'coach', name:'백호 · 운동 코치', image:config.tiger, line:'운동이 궁금해? 내가 도와줄게!', intro:'나는 운동을 잘할 수 있게 도와주는 백호 핏봇이야! 목표나 운동 방법이 궁금하면 편하게 물어봐.'},
    {id:'facility', name:'백곰 · 시설 안내', image:config.bear, line:'가까운 운동 시설을 찾고 있어? 내가 찾아볼게!', intro:'나는 운동 시설을 안내하는 백곰 핏봇이야! 지역과 찾는 시설을 골라주면 NETFIT에 등록된 곳을 보여줄게.'},
    {id:'meal', name:'햄스터 · 식단 도우미', image:config.hamster, line:'오늘 뭐 먹을지 고민돼? 같이 생각해보자!', intro:'나는 식사 아이디어를 함께 고르는 햄스터 핏봇이야! 먹고 싶은 음식이나 선호하는 식단을 말해줘.'},
    {id:'court', name:'아기공룡 · 변명재판소', image:config.dino, line:'오늘 운동을 못 했다고? 변명을 들어볼게!', intro:'나는 변명재판소의 아기공룡 판사야! 오늘 운동을 못 한 이유를 말하면 재미있게 판결하고 작은 다음 행동을 제안할게.'}
  ];
  const commonGuide = '우리 네 핏봇은 이렇게 도와줘! 백호는 운동 상담, 백곰은 시설 안내, 햄스터는 식단 안내, 아기공룡은 변명재판소를 맡고 있어. 다른 핏봇이 궁금하면 위에서 캐릭터를 바꿔봐!';
  const root = document.createElement('aside'); root.id = 'netfit-fitbot';
  root.setAttribute('aria-label', 'NETFIT 핏봇');
  root.innerHTML = `<div class="fb-launch"><p class="fb-bubble" role="status" hidden></p><button class="fb-dismiss" type="button" aria-label="핏봇 위젯 닫기">×</button><div class="fb-cards" role="group" aria-label="핏봇 캐릭터 선택"></div></div>
    <section class="fb-dialog" role="dialog" aria-label="핏봇 상담" hidden>
      <header class="fb-head"><img alt=""><strong class="fb-title"></strong><button class="fb-dialog-close" type="button" aria-label="상담창 닫기">×</button></header>
      <nav class="fb-tabs" aria-label="상담 캐릭터 선택"></nav>
      <div class="fb-filters" hidden><label>지역<select aria-label="시설 지역"></select></label><label>시설 검색<input class="fb-query" maxlength="60" placeholder="예: 수영장, 강남"></label><button type="button" class="fb-search">시설 찾기</button></div>
      <div class="fb-messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <p class="fb-note">대화 내용은 AI 답변을 위해 전송됩니다. 민감한 개인정보는 입력하지 마세요.</p>
      <form><input class="fb-input" maxlength="800" aria-label="핏봇 질문" placeholder="궁금한 점을 물어보세요" required><button type="submit">전송</button></form>
    </section><div class="fb-toast" role="status" hidden>상단 메뉴의 '핏봇'을 눌러 언제든 다시 불러올 수 있습니다. <button type="button" data-fitbot-open style="margin-left:6px;background:#137c63;color:#fff;border:0;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px;">지금 열기</button></div><button class="fb-reopen-pill" type="button" data-fitbot-open hidden title="핏봇 열기"><span>🤖</span> 핏봇</button>`;
  document.body.append(root);
  const $ = q => root.querySelector(q), launch = $('.fb-launch'), dialog = $('.fb-dialog'), cards = $('.fb-cards'), messages = $('.fb-messages');
  const state = bots.map(b => ({entries:[{text:b.intro, kind:'bot'},{text:commonGuide, kind:'bot'}], history:[], busy:false}));
  let current = 0, rendered = -1, hover = false, collapseTimer, bubbleTimer, csrf = '', bootstrapPromise = null, toastTimer;
  let opener = cards;
  const bubble = $('.fb-bubble');
  function hideBubble(){bubble.hidden=true}
  function scheduleCollapse(){
    clearTimeout(collapseTimer);
    collapseTimer=setTimeout(()=>{
      if(!cards.querySelector('.fb-face:hover')&&!$('.fb-dismiss').matches(':hover')){
        hover=false;launch.classList.remove('fb-expanded','fb-dismiss-visible');hideBubble();
      }
    },1000);
  }
  function speak(i){if(dialog.hidden){
    const face=cards.children[i], faceBox=face.getBoundingClientRect(), launchBox=launch.getBoundingClientRect();
    const center=faceBox.left+faceBox.width/2-launchBox.left;
    const bubbleWidth=188;
    const left=Math.max(0,Math.min(launch.clientWidth-bubbleWidth,center-bubbleWidth/2));
    bubble.textContent=bots[i].line;
    bubble.style.left=left+'px';
    bubble.style.setProperty('--bubble-arrow',(center-left-7)+'px');
    bubble.hidden=false;
  }}
  const store = {get(){try{return localStorage.getItem('netfit-fitbot-hidden')==='1'}catch{return false}},set(v){try{localStorage.setItem('netfit-fitbot-hidden',v?'1':'0')}catch{}}};
  bots.forEach((b,i) => {
    const face = document.createElement('button'); face.className='fb-face'; face.type='button'; face.dataset.bot=b.id; face.style.setProperty('--index',String(i)); face.setAttribute('aria-label',b.name+' 대화 열기'); const img=document.createElement('img'); img.src=b.image; img.alt=''; face.append(img); cards.append(face);
    face.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse'||event.pointerType==='pen'){clearTimeout(collapseTimer);launch.classList.add('fb-dismiss-visible')}if(dialog.hidden&&(event.pointerType==='mouse'||event.pointerType==='pen')){hover=true;launch.classList.add('fb-expanded');speak(i);clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>{if(hover&&dialog.hidden&&face.matches(':hover'))speak(i)},320)}});
    face.addEventListener('pointermove',event=>{if(event.pointerType==='mouse'||event.pointerType==='pen')speak(i)}); face.addEventListener('pointerleave',()=>{hideBubble();scheduleCollapse()});
    face.addEventListener('focus',()=>speak(i)); face.addEventListener('blur',hideBubble);
    face.onclick=()=>{current=i;opener=face;hideBubble();openChat()};
    const button = document.createElement('button'); button.type='button'; button.textContent=b.name.split(' · ')[0]; button.onclick=()=>select(i); $('.fb-tabs').append(button);
  });
  function safeLink(url){try{const u=new URL(url,location.href);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
  function drawEntry(entry){
    const wrap = document.createElement('div');
    wrap.className = 'fb-msg-wrap ' + entry.kind;
    if (entry.kind === 'bot') {
      const avatar = document.createElement('div');
      avatar.className = 'fb-avatar';
      const img = document.createElement('img');
      img.src = entry.avatar || bots[current].image;
      img.alt = bots[current].name;
      avatar.append(img);
      wrap.append(avatar);
    }
    const group = document.createElement('div');
    group.className = 'fb-bubble-group';
    const node = document.createElement('div');
    node.className = 'fb-msg ' + entry.kind;
    node.textContent = entry.text;
    group.append(node);
    for(const f of entry.facilities||[]){
      const card = document.createElement('div');
      card.className = 'fb-facility';
      const name = document.createElement('strong');
      name.textContent = f.name;
      const address = document.createElement('p');
      address.textContent = f.address;
      card.append(name, address);
      const href = safeLink(f.url);
      if(href){
        const link = document.createElement('a');
        link.href = href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '지도에서 보기';
        card.append(link);
      }
      group.append(card);
    }
    if(entry.more_url){
      const href = safeLink(entry.more_url);
      if(href){
        const link = document.createElement('a');
        link.href = href;
        link.className = 'fb-more';
        link.textContent = '내 주변 시설 페이지 열기';
        group.append(link);
      }
    }
    wrap.append(group);
    messages.append(wrap);
  }
  function renderMessages(){messages.replaceChildren();state[current].entries.forEach(drawEntry);messages.scrollTop=messages.scrollHeight;const busy=state[current].busy;$('.fb-input').disabled=busy;$('form button').disabled=busy;$('.fb-search').disabled=busy;messages.setAttribute('aria-busy',String(busy))}
  function render(){
    const b=bots[current];
    [...cards.children].forEach((el,i)=>el.classList.toggle('fb-front',i===current));
    if(rendered!==current){const img=cards.children[current].querySelector('img');if(rendered>=0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)img.animate([{transform:'rotateY(90deg)',opacity:.6},{transform:'rotateY(0deg)',opacity:1}],{duration:360,easing:'ease-out'});rendered=current;}
    [...$('.fb-tabs').children].forEach((el,i)=>el.setAttribute('aria-pressed',String(i===current)));
    $('.fb-title').textContent=b.name;$('.fb-head img').src=b.image;$('.fb-filters').hidden=b.id!=='facility';$('form').hidden=b.id==='facility';$('.fb-note').hidden=b.id==='facility';renderMessages();
  }
  async function bootstrap(){
    if(csrf||config.demo==='true')return;
    if(bootstrapPromise)return bootstrapPromise;
    bootstrapPromise=(async()=>{const res=await fetch(config.bootstrap,{credentials:'same-origin',cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'연결할 수 없어요.');csrf=data.csrf_token;const select=$('.fb-filters select');select.replaceChildren();for(const region of data.regions){const option=document.createElement('option');option.value=option.textContent=region;select.append(option)}select.value=data.region;})().finally(()=>bootstrapPromise=null);
    return bootstrapPromise;
  }
  function select(i){current=i;render();}
  async function openChat(){hideBubble();launch.classList.remove('fb-dismiss-visible');hover=false;launch.classList.remove('fb-expanded');launch.classList.add('fb-chat');dialog.hidden=false;render();try{await bootstrap()}catch(e){state[current].entries.push({kind:'error',text:e.message});renderMessages()}(bots[current].id==='facility'?$('.fb-filters select'):$('.fb-input')).focus()}
  const reopenPill = $('.fb-reopen-pill'); function show(){launch.hidden=false;if(reopenPill)reopenPill.hidden=true;launch.classList.remove('fb-chat','fb-expanded','fb-dismiss-visible');store.set(false);$('.fb-toast').hidden=true;hideBubble();render()}
  function closeChat(){dialog.hidden=true;launch.classList.remove('fb-chat');(opener?.isConnected?opener:cards).focus()}
  $('.fb-dialog-close').onclick=closeChat;
  $('.fb-dismiss').addEventListener('pointerenter',()=>clearTimeout(collapseTimer));
  $('.fb-dismiss').addEventListener('pointerleave',scheduleCollapse);
  $('.fb-dismiss').onclick=()=>{hideBubble();launch.hidden=true;if(reopenPill)reopenPill.hidden=false;dialog.hidden=true;launch.classList.remove('fb-chat','fb-expanded','fb-dismiss-visible');store.set(true);$('.fb-toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.fb-toast').hidden=true,4000);document.querySelector('[data-fitbot-open]')?.focus()};
  document.addEventListener('click',e=>{const button=e.target.closest('[data-fitbot-open]');if(button){show();opener=button;cards.querySelector('.fb-front')?.focus()}});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden){e.preventDefault();closeChat()}});
  
  setInterval(()=>{if(!hover&&!root.contains(document.activeElement)&&!launch.hidden&&dialog.hidden&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches){current=(current+1)%bots.length;render()}},5000);
  async function send(text){
    const index=current, s=state[index], role=bots[index].id;if(s.busy||!text.trim())return;
    const payload={role,message:text.trim(),history:s.history.slice(-8)};
    if(role==='facility'){payload.region=$('.fb-filters select').value;payload.query=$('.fb-query').value.trim()}
    s.entries.push({kind:'user',text});const pending={kind:'bot',text:'답변을 준비하고 있어요.'};s.entries.push(pending);s.busy=true;renderMessages();
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),30000);
    try{
      if(config.demo==='true'){await new Promise(r=>setTimeout(r,350));pending.text='화면 시연 모드입니다. 서버 연결 후 실제 답변을 받을 수 있어요.';return}
      await bootstrap();
      const res=await fetch(config.endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(payload),signal:controller.signal});
      let data;try{data=await res.json()}catch{throw new Error(res.status===403?'로그인이 만료되었어요. 새로고침 후 다시 이용해 주세요.':'연결 오류가 발생했어요. 잠시 후 다시 이용해 주세요.')}
      if(!res.ok)throw new Error(data.error||'답변을 받지 못했어요.');
      if(typeof data.reply!=='string')throw new Error('답변을 받지 못했어요.');
      Object.assign(pending,{text:data.reply,facilities:data.facilities,more_url:data.more_url});
      s.history.push({role:'user',text:text.trim()},{role:'model',text:data.reply});
      while(s.history.length>8||s.history.reduce((sum,h)=>sum+h.text.length,0)>10000)s.history.splice(0,2);
    }catch(e){pending.kind='error';pending.text=e.name==='AbortError'?'응답이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.':e.message}
    finally{clearTimeout(timer);s.busy=false;if(current===index)renderMessages()}
  }
  $('form').onsubmit=e=>{e.preventDefault();const input=$('.fb-input'),value=input.value;if(!value.trim())return;input.value='';send(value)};
  $('.fb-search').onclick=()=>send(`${$('.fb-filters select').value} ${$('.fb-query').value||'운동 시설'} 찾아줘`);
  window.NetfitFitbot={open:show,select(role){const i=bots.findIndex(b=>b.id===role);if(i>=0){show();select(i);openChat()}}};
  if(config.demo==='true'){$('.fb-filters select').innerHTML='<option>서울특별시</option><option>경기도</option>'}
  // Persist hiding only when a reopen control exists.
  const isHidden=Boolean(document.querySelector('[data-fitbot-open]'))&&store.get();launch.hidden=isHidden;if(reopenPill)reopenPill.hidden=!isHidden;render();
})();
</script>

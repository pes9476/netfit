<!-- ==========================================================================
     🎁 [국민체육진흥공단 × 넷핏] 튼튼머니 실제 브라우저 팝업 (window.open) 제어기
     HTML DOM 내부 렌더링 부하를 없애고 별도의 가벼운 독립 팝업창으로 띄웁니다.
     ========================================================================== -->
<script>
const TEUNTEUN_STORAGE_KEY = "netfit_teunteun_popup_hide_until";
const TEUNTEUN_POPUP_URL = "{% url 'teunteun_popup' %}";

window.openTeunTeunPopup = function(force = false) {
  if (!force) {
    const params = new URLSearchParams(window.location.search);
    const forceParam = params.get("popup");
    if (forceParam === "1" || forceParam === "true") {
      force = true;
    }
  }

  if (!force) {
    try {
      const hideUntil = localStorage.getItem(TEUNTEUN_STORAGE_KEY);
      if (hideUntil) {
        const hideTimestamp = parseInt(hideUntil, 10);
        if (Date.now() < hideTimestamp) {
          return null;
        } else {
          localStorage.removeItem(TEUNTEUN_STORAGE_KEY);
        }
      }
    } catch (e) {}
  }

  // 실제 브라우저 팝업 창 규격 (우측 상단 배치)
  const width = 380;
  const height = 520;
  const screenW = window.screen.availWidth || window.screen.width || 1280;
  const left = Math.max(0, screenW - width - 40);
  const top = 70;
  const features = `width=${width},height=${height},left=${left},top=${top},location=no,menubar=no,toolbar=no,status=no,resizable=no,scrollbars=no`;

  try {
    const popupWin = window.open(TEUNTEUN_POPUP_URL, "NetfitTeunTeunPopup", features);
    if (popupWin) {
      popupWin.focus();
    }
    return popupWin;
  } catch (err) {
    console.warn("Teunteun popup window could not be opened:", err);
    return null;
  }
};

window.closeTeunTeunPopup = function() {
  // 하위 호환용 (실제 팝업창 내부에서 window.close()로 닫힘)
};

// 메인 대시보드 진입 시 24시간 미설정 사용자에게 실제 팝업 띄우기
document.addEventListener("DOMContentLoaded", () => {
  {% if request.resolver_match.url_name == 'dashboard' %}
    setTimeout(() => {
      window.openTeunTeunPopup(false);
    }, 500);
  {% endif %}
});
</script>

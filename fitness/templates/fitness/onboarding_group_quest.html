{% extends "fitness/base.html" %}
{% block content %}
<section class="onboarding-shell compact">
  <div class="onboarding-progress"><span class="done">1 안내</span><i></i><span class="done">2 프로필</span><i></i><span class="done">3 운동 방식</span><i></i><span class="active">4 그룹 설정</span></div>
  <header class="onboarding-heading"><span>PARTY DAILY MISSION</span><h1>{{ party.name }} 일일미션</h1><p>파티원이 함께 할 운동을 직접 입력해 주세요.</p></header>
  <div class="onboarding-group-grid">
    <aside class="panel group-members"><h2>참여 멤버</h2>{% for member in members %}<p>👤 {{ member.profile.display_name|default:member.username }}</p>{% endfor %}</aside>
    <form method="post" class="panel quest-form">{% csrf_token %}<label for="questTitle">일일미션 직접 입력</label><input class="input" id="questTitle" name="title" maxlength="100" required placeholder="예: 러닝 30분 또는 저녁 산책"><label for="workoutType">운동 종류</label><select class="input custom-workout-select" id="workoutType" name="workout_type"><option value="러닝">🏃 러닝</option><option value="걷기">🚶 산책</option><option value="수영">🏊 수영</option><option value="배드민턴">🏸 배드민턴</option><option value="자전거">🚲 자전거</option><option value="헬스">🏋️ 헬스</option><option value="등산">🥾 등산</option><option value="축구">⚽ 축구</option><option value="농구">🏀 농구</option><option value="요가">🧘 요가</option><option value="기타">✍️ 직접입력</option></select><div class="custom-workout-field" hidden><label for="customWorkoutName">직접 입력할 운동</label><input class="input" id="customWorkoutName" name="custom_workout_name" maxlength="50" placeholder="예: 필라테스, 탁구, 복싱"></div><label for="targetMinutes">목표 시간</label><div class="minute-input"><input class="input" id="targetMinutes" name="target_minutes" type="number" min="5" max="300" value="30" required><span>분</span></div><button class="button onboarding-next" type="submit">파티 일일미션 저장하고 시작 →</button></form>
  </div>
</section><script>document.querySelectorAll('.custom-workout-select').forEach(select=>{const field=select.parentElement.querySelector('.custom-workout-field'),input=field.querySelector('input');const toggle=()=>{const show=select.value==='기타';field.hidden=!show;input.required=show;if(show)input.focus()};select.addEventListener('change',toggle);toggle()});</script>
{% endblock %}
